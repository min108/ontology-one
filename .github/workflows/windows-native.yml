name: Native Windows distribution
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['release/*']
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      application_version: ${{ steps.version.outputs.value }}
    env:
      ONTOLOGY_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read and validate application version
        id: version
        shell: pwsh
        run: |
          $version = [IO.File]::ReadAllText((Join-Path $pwd 'VERSION')).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid application VERSION' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag does not match application VERSION' }
          "ONTOLOGY_APP_VERSION=$version" >> $env:GITHUB_ENV
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile frontend
        shell: pwsh
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore official dependency download cache
        id: native-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ontology-downloads
          key: ontology-windows-runtime-${{ hashFiles('ops/windows-runtime.lock.json', 'ops/windows-wheels.lock.json') }}
          restore-keys: ontology-windows-runtime-
      - name: Build self-contained package from fixed official dependencies
        shell: pwsh
        run: |
          $arguments = @('-X', 'utf8', 'scripts/build_windows_release.py', '--output', 'out', '--cache', "$env:RUNNER_TEMP/ontology-downloads")
          $lock = Get-Content -Raw ops/windows-runtime.lock.json | ConvertFrom-Json
          $unresolved = (-not $lock.mysql.sha256) -or (-not $lock.mysql_source.sha256) -or (-not $lock.vc_license.sha256) -or (-not $lock.vc_runtime.version)
          if ('${{ github.event_name }}' -eq 'pull_request' -and $unresolved) { $arguments += '--bootstrap-lock' }
          python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache downloads for incremental QA
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/ontology-downloads
          key: ontology-windows-runtime-${{ hashFiles('ops/windows-runtime.lock.json', 'ops/windows-wheels.lock.json') }}
      - name: Retrieve the published immutable 0.6.0 Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'out/upgrade-baseline' | Out-Null
          gh release download v0.6.0 --repo "$env:GITHUB_REPOSITORY" --pattern 'ontology-one-0.6.0-windows-x64.zip' --dir out/upgrade-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Published 0.6.0 Windows distribution is required' }
      - name: Verify previous Windows distribution bytes
        shell: pwsh
        run: |
          $expected = '6a89d07786c922047c7e77774f52ab543f9e6cbd12d9d8bf6ed53e8ff39567f3'
          if ((Get-FileHash 'out/upgrade-baseline/ontology-one-0.6.0-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Previous distribution checksum mismatch' }
      - name: Native standard-user acceptance without system Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qaUser = "ontoqa$env:GITHUB_RUN_ID"
          if ($qaUser.Length -gt 20) { $qaUser = $qaUser.Substring(0,20) }
          $qaRoot = Join-Path "C:\OntologyOne-QA-$env:GITHUB_RUN_ID" '本体 Windows QA !'
          $reports = Join-Path $qaRoot 'safe-reports'
          $randomBytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $password = 'Qa9!' + [Convert]::ToBase64String($randomBytes)
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object Management.Automation.PSCredential(".\$qaUser", $secure)
          $null = New-LocalUser -Name $qaUser -Password $secure -AccountNeverExpires -PasswordNeverExpires
          $null = Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $qaUser
          try {
            New-Item -ItemType Directory -Force -Path $qaRoot,$reports | Out-Null
            Expand-Archive -LiteralPath "out/ontology-one-${env:ONTOLOGY_APP_VERSION}-windows-x64.zip" -DestinationPath $qaRoot
            Expand-Archive -LiteralPath 'out/upgrade-baseline/ontology-one-0.6.0-windows-x64.zip' -DestinationPath $qaRoot
            $baselinePackage = Join-Path $qaRoot 'Ontology-One-0.6.0-windows-x64'
            $sid = (Get-LocalUser -Name $qaUser).SID.Value
            & icacls.exe $qaRoot /grant "*${sid}:(OI)(CI)F" /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant disposable account directory access' }
            $package = Join-Path $qaRoot "Ontology-One-${env:ONTOLOGY_APP_VERSION}-windows-x64"
            $python = Join-Path $package 'runtime/python/python.exe'
            $entry = Join-Path $package 'scripts/check_windows_ci.py'
            if ('${{ github.event_name }}' -eq 'pull_request') {
              & ./.github/scripts/windows-loader-capture.ps1 -Package $package -Reports $reports -Credential $credential
            }
            $arguments = @('-I', '-X', 'utf8', '-B', "`"$entry`"", '--package', "`"$package`"", '--report-dir', "`"$reports`"", '--upgrade-baseline', "`"$baselinePackage`"")
            $process = Start-Process -FilePath $python -ArgumentList $arguments -Credential $credential -LoadUserProfile -WorkingDirectory $qaRoot -RedirectStandardOutput (Join-Path $reports 'ci-entry.stdout.log') -RedirectStandardError (Join-Path $reports 'ci-entry.stderr.log') -PassThru
            if (-not $process.WaitForExit(2700000)) { throw 'Native acceptance exceeded its time budget' }
            $process.Refresh()
            @{ exit_code = $process.ExitCode; has_exited = $process.HasExited } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $reports 'ci-entry-state.json')
            New-Item -ItemType Directory -Force -Path 'out/reports' | Out-Null
            Copy-Item -Path (Join-Path $reports '*') -Destination 'out/reports' -Force
            if ($process.ExitCode -ne 0) { throw 'Native acceptance failed; see safe reports' }
          } finally {
            if (Test-Path $reports) {
              New-Item -ItemType Directory -Force -Path 'out/reports' | Out-Null
              Copy-Item -Path (Join-Path $reports '*') -Destination 'out/reports' -Force -ErrorAction SilentlyContinue
            }
            if ($package -and (Test-Path $python)) {
              $stopArgs = @('-I', '-X', 'utf8', '-B', "`"$(Join-Path $package 'ops/windows_launcher.py')`"", 'stop', '--json')
              Start-Process -FilePath $python -ArgumentList $stopArgs -Credential $credential -LoadUserProfile -WorkingDirectory $qaRoot -Wait -ErrorAction SilentlyContinue | Out-Null
            }
            Remove-LocalUser -Name $qaUser -ErrorAction SilentlyContinue
            $password = $null; $secure = $null; $credential = $null
          }
      - name: Print bounded native acceptance summary
        if: always()
        shell: pwsh
        run: |
          python .github/scripts/summarize_windows_acceptance.py --reports out/reports
      - name: Preserve only safe diagnostics and candidate dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/reports
            out/resolved-windows-runtime.lock.json
            out/windows-build-provenance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified distribution assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-distribution-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/ontology-one-${{ steps.version.outputs.value }}-windows-x64.zip
            out/mysql-*-corresponding-source.tar.gz
            out/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-distribution-${{ github.sha }}
          path: release-assets
      - name: Verify asset integrity and create a new release without overwrites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPLICATION_VERSION: ${{ needs.windows.outputs.application_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPLICATION_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" == "refs/tags/v$APPLICATION_VERSION" ]]
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          if gh release view "v$APPLICATION_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.'
            exit 1
          fi
          release_branch="release/$APPLICATION_VERSION"
          if ! branch_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$release_branch" --jq '.object.sha' 2>/dev/null); then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$release_branch" -f "sha=$GITHUB_SHA" >/dev/null
            branch_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$release_branch" --jq '.object.sha')
          fi
          if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
            echo 'Release branch points to a different commit; refusing to change it.'
            exit 1
          fi
          cat > release-notes.txt <<'NOTES'
          Ontology One includes a native Windows x64 distribution with its own Python, MySQL and pinned official Harness runtime.
          Download the Windows ZIP and retain the accompanying SHA256SUMS. The MySQL source archive accompanies its GPL distribution.
          This version is published independently; previous version branches/tags and main are preserved.
          NOTES
          gh release create "v$APPLICATION_VERSION" "ontology-one-$APPLICATION_VERSION-windows-x64.zip" mysql-*-corresponding-source.tar.gz SHA256SUMS.txt --verify-tag --draft --title "Ontology One $APPLICATION_VERSION" --notes-file release-notes.txt
          gh release edit "v$APPLICATION_VERSION" --draft=false --latest=false
