name: Focused Windows CPU diagnostic
on:
  pull_request:
    branches: ['qa/windows-native-0.5.0']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: focused-windows-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-cpu:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13774981630'
          run-id: '42835020023'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline
          merge-multiple: true
      - name: Repeat unchanged CPU limits as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'baseline/ontology-one-0.5.0-windows-x64.zip'
          $expected = '557f407262f6912b862be032bf83c19bbaf52bd63b7a43b1470bae8dd90a59e4'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Verified runtime checksum mismatch' }
          $qaUser = "ontocpu$env:GITHUB_RUN_ID"
          if ($qaUser.Length -gt 20) { $qaUser = $qaUser.Substring(0,20) }
          $qaRoot = Join-Path "C:\OntologyOne-CPU-$env:GITHUB_RUN_ID" '本体 CPU !'
          $randomBytes = New-Object byte[] 32
          [Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $secure = ConvertTo-SecureString ('Cpu9!' + [Convert]::ToBase64String($randomBytes)) -AsPlainText -Force
          $credential = New-Object Management.Automation.PSCredential(".\$qaUser", $secure)
          $null = New-LocalUser -Name $qaUser -Password $secure -AccountNeverExpires -PasswordNeverExpires
          $null = Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $qaUser
          try {
            New-Item -ItemType Directory -Force -Path $qaRoot | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $qaRoot
            $package = Join-Path $qaRoot 'Ontology-One-0.5.0-windows-x64'
            $python = Join-Path $package 'runtime/python/python.exe'
            $entry = Join-Path $qaRoot 'probe_windows_cpu.py'
            $report = Join-Path $qaRoot 'cpu-probe.json'
            Copy-Item .github/scripts/probe_windows_cpu.py $entry
            $processHash = (Get-FileHash backend/windows_process.py -Algorithm SHA256).Hash.ToLowerInvariant()
            $sid = (Get-LocalUser -Name $qaUser).SID.Value
            & icacls.exe $qaRoot /grant "*${sid}:(OI)(CI)F" /T /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant disposable account directory access' }
            $arguments = @('-I', '-X', 'utf8', '-B', "`"$entry`"", '--package', "`"$package`"", '--report', "`"$report`"", '--process-sha256', $processHash)
            $process = Start-Process -FilePath $python -ArgumentList $arguments -Credential $credential -LoadUserProfile -WorkingDirectory $qaRoot -RedirectStandardOutput (Join-Path $qaRoot 'private.stdout.log') -RedirectStandardError (Join-Path $qaRoot 'private.stderr.log') -PassThru
            if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'Focused CPU diagnostic exceeded its time budget' }
            $process.Refresh()
            if (Test-Path $report) {
              & $python -I -X utf8 -B $entry --report $report --summarize
              New-Item -ItemType Directory -Force -Path out | Out-Null
              Copy-Item $report out/cpu-probe.json
            } else { Write-Output 'CPU_PROBE_REPORT_UNAVAILABLE' }
            if ($process.ExitCode -ne 0) { throw 'Focused CPU trials included a fixed error; see bounded summary' }
          } finally {
            Remove-LocalUser -Name $qaUser -ErrorAction SilentlyContinue
            $secure = $null; $credential = $null
          }
      - name: Retain numeric CPU probe report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-cpu-${{ github.event.pull_request.head.sha }}
          path: out/cpu-probe.json
          if-no-files-found: warn
          retention-days: 7
