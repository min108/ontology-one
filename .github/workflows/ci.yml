  offline:
    # Same checkout as foundation; no cached source, dependency bundle or acceptance result.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare final locked offline dependencies online
        run: |
          mkdir -p work/evidence/r1/offline-preparation
          set -euo pipefail
          python ops/offline/prepare.py --output work/offline/ci 2>&1 | tee work/evidence/r1/offline-preparation/prepare.log
          cp work/offline/ci/manifest.json work/offline/ci/source.json work/offline/ci/images.json work/evidence/r1/offline-preparation/
      - name: Install build migrate and start without external networking
        run: python ops/offline/verify.py --bundle work/offline/ci --evidence work/evidence/r1/offline
      - name: Package exact source offline evidence
        if: always()
        run: python scripts/build_evidence.py --input work/evidence/r1/offline-preparation --input work/evidence/r1/offline --steps e2e/REPRODUCE.md --output work/packages/offline
      - name: Upload readable offline evidence and archive digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-offline-evidence-${{ github.run_id }}
          path: |
            work/packages/offline/
            work/packages/offline.tar.gz
            work/packages/offline.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact offline dependency bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-offline-dependencies-${{ github.run_id }}
          path: work/offline/ci/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
