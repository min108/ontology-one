name: Linux foundation CI
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: ['dev/**']
permissions:
  contents: read
concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: r1-synthetic-ci-database-only
          MYSQL_ROOT_HOST: '%'
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: r1-synthetic-ci-database-only
      RUN_HARNESS_SDK_TESTS: '1'
      RUN_FEDERATION_MYSQL_TESTS: '1'
      RUN_JOBS_MYSQL_TESTS: '1'
      ONTOLOGY_HARNESS_TMP_ROOT: /tmp/ontology-harness-ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          npm --prefix frontend ci
      - name: Prepare isolated test infrastructure
        run: |
          mkdir -p "$ONTOLOGY_HARNESS_TMP_ROOT" work/evidence/r1/ci
          sudo mount -t tmpfs -o size=256m,mode=1777,rw,exec,nosuid,nodev tmpfs "$ONTOLOGY_HARNESS_TMP_ROOT"
          python - <<'PYTHON'
          import os, pymysql
          from backend.skill_harness import _work_root
          print('Verified Harness memory workspace:', _work_root())
          with pymysql.connect(host=os.environ['MYSQL_HOST'], port=int(os.environ['MYSQL_PORT']), user=os.environ['MYSQL_USER'], password=os.environ['MYSQL_PASSWORD']) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET GLOBAL character_set_server = 'utf8mb4'")
                  cur.execute("SET GLOBAL collation_server = 'utf8mb4_unicode_ci'")
                  cur.execute("SET GLOBAL max_connections = 512")
          PYTHON
          docker build -f ops/skill-runner.Dockerfile -t ontology-skill-test:0.5.0 .
      - name: Code checks
        run: |
          ruff format --check backend scripts ops tests migrations .github/scripts e2e
          ruff check backend scripts ops tests migrations .github/scripts e2e
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
          npm --prefix frontend run lint:styles
          python scripts/gen_api_types.py --check
          python scripts/gen_terms.py --check
          python scripts/checks/check_tokens.py
          python scripts/checks/check_terms.py
          python scripts/checks/check_migrations.py
          python scripts/checks/check_policy_coverage.py
          npm --prefix frontend test -- --run
          node --test e2e/*.test.mjs
      - name: Verify frozen formatting history independently
        run: python scripts/checks/check_historical_format.py --output work/evidence/r1/ci/historical-format.json
      - name: Backend and pipeline tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee work/evidence/r1/ci/backend.log
          python scripts/checks/check_regression_results.py work/evidence/r1/ci/backend.log --output work/evidence/r1/ci/backend-results.json
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v 2>&1 | tee work/evidence/r1/ci/pipeline.log
      - name: Existing regressions and synthetic model evaluation
        run: |
          set -euo pipefail
          for name in restore_v020 security workflows sources mcp skills entity_storage agent_runtime; do
            python "scripts/check_${name}.py" 2>&1 | tee "work/evidence/r1/ci/check_${name}.log"
          done
      - name: Original 0.7.0 upgrade and recovery drill
        run: |
          set -euo pipefail
          git worktree add --detach work/v070-source 1359118dd672431dcd0cde2eb81f2b0f994eef37
          python scripts/drills/upgrade_from_v070.py --v070-source work/v070-source --output work/evidence/r1/ci/upgrade-drill.json 2>&1 | tee work/evidence/r1/ci/upgrade-drill.log
      - name: Original identity and grant behavior comparison across migration
        run: |
          set -euo pipefail
          python scripts/drills/compare_identity_v070.py --v070-source work/v070-source --current-source . --output work/evidence/r1/ci/identity-v070-comparison.json 2>&1 | tee work/evidence/r1/ci/identity-v070-comparison.log
      - name: Frontend build
        run: |
          set -euo pipefail
          npm --prefix frontend run build 2>&1 | tee work/evidence/r1/ci/frontend.log
      - name: Offline source and artifact checks
        run: python scripts/checks/check_offline.py --require-dist
      - name: Install fixed browser for acceptance
        run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Original UI browser baseline
        run: python e2e/run.py --target legacy --evidence work/evidence/r1/e2e-legacy-ci
      - name: Original replacement-page comparison screenshots
        run: python e2e/run.py --target legacy --evidence work/evidence/r1/e2e-legacy-replacements-ci -- --config e2e/legacy-replacements.config.mjs
      - name: Foundation core pages home identity and SDK acceptance
        run: python e2e/run.py --target foundation --harness --evidence work/evidence/r1/e2e-foundation-ci
      - name: Administration operations in a separate fresh fixture scope
        run: python e2e/run_admin.py --evidence work/evidence/r1/e2e-admin-ci
      - name: Canonical visuals in a separate fresh fixture scope
        run: python e2e/run.py --target foundation --visual-only --evidence work/evidence/r1/e2e-visual-ci
      - name: Verify exact browser inventories and cleanup
        run: python e2e/check_results.py --output work/evidence/r1/ci/browser-acceptance.json
      - name: Upload available evidence
        id: complete-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-foundation-ci-${{ github.run_id }}
          path: work/evidence/r1/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload readable aggregate acceptance summary
        if: always()
