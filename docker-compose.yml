name: ontology-one-v020

x-app: &app
  image: ontology-one:${ONTOLOGY_APP_VERSION:-0.6.0}
  build: .
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - ontology_files:/app/data
  environment: &runtime
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: ontology_one_v020
    MYSQL_USER: ontology_runtime
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ONTOLOGY_STORAGE_ROOT: /app/data/tenants
    ONTOLOGY_WORKER_ENABLED: "0"
    ONTOLOGY_DB_POOL_SIZE: ${ONTOLOGY_DB_POOL_SIZE:-16}
    ONTOLOGY_TRUSTED_ORIGINS: ${ONTOLOGY_TRUSTED_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}
    ONTOLOGY_COOKIE_SECURE: ${ONTOLOGY_COOKIE_SECURE:-0}
    ONTOLOGY_MCP_ALLOWED_HOSTS: ${ONTOLOGY_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    ONTOLOGY_MCP_MAX_CONCURRENT: ${ONTOLOGY_MCP_MAX_CONCURRENT:-4}
    ONTOLOGY_HARNESS_MAX_CONCURRENT: ${ONTOLOGY_HARNESS_MAX_CONCURRENT:-2}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=256"]
    volumes:
      - ontology_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *runtime
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      ONTOLOGY_RUNTIME_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["python", "ops/provision.py"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *runtime
      ONTOLOGY_HARNESS_TMP_ROOT: /run/ontology-harness
      ONTOLOGY_AGENT_SERVICE_URL: http://agent:8766
      ONTOLOGY_AGENT_ALLOW_DOCKER_SERVICE: "1"
    # The pinned Harness runtime loads native addons from its private session
    # directory. Keep this executable tmpfs separate from /tmp and /dev/shm.
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/ontology-harness:rw,exec,nosuid,nodev,size=256m,mode=1777
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8765", "--workers", "${ONTOLOGY_API_WORKERS:-4}"]
    ports:
      - "127.0.0.1:${ONTOLOGY_PORT:-8765}:8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  agent:
    <<: *app
    environment:
      <<: *runtime
      ONTOLOGY_HARNESS_TMP_ROOT: /run/ontology-harness
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/ontology-harness:rw,exec,nosuid,nodev,size=256m,mode=1777
    # Single memory-only session owner shared by all authenticated API workers.
    # No published host port; the broker repeats session, tenant and CSRF checks.
    command: ["python", "-m", "uvicorn", "backend.agent_service:app", "--host", "0.0.0.0", "--port", "8766", "--workers", "1", "--no-access-log"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8766/internal/health',timeout=3)); assert r['ready'] and r['service']=='ontology-agent'"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: ["python", "scripts/run_worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  ontology_mysql:
  ontology_files:
