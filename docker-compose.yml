name: ontology-one

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ontology_one
      MYSQL_USER: ontology
      MYSQL_PASSWORD: ontology_local
      MYSQL_ROOT_PASSWORD: ontology_root_local
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ontology_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pontology_root_local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  ontology_mysql_data:
