[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["work", ".venv", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Chinese business punctuation is intentional; other ambiguous characters are checked.
allowed-confusables = ["，", "。", "：", "；", "？", "！", "（", "）", "【", "】", "《", "》", "“", "”", "‘", "’", "、", "—", "…", "·", "％", "～"]

[tool.ruff.lint.per-file-ignores]
# Measured 0.7.0 diagnostics after format-only normalization. Never auto-fix
# legacy re-exports. Exact files only: new packages receive every selected rule.
